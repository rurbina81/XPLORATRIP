[build]
  publish = "."
  functions = "netlify/functions"

# English 404 page for unmatched /en/* paths
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

# Security headers — all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://www.facebook.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Destination card images — immutable (filenames don't change)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts — immutable
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logos and OG image — 30 days
[[headers]]
  for = "/logo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Blog images (thumbnails + inline article photos) — 30 days.
# Wildcards so new articles are covered automatically instead of needing a manual rule each time.
[[headers]]
  for = "/blog/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/blog/*/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/blog/*/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Nosotros photo
[[headers]]
  for = "/nosotros/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/nosotros/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Emprende page images — 30 days
[[headers]]
  for = "/emprende/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/emprende/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Venezuela page images — 30 days
[[headers]]
  for = "/venezuela/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/venezuela/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Airline logos — 30 days
[[headers]]
  for = "/images/airlines/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Shared external CSS — 30 days (same tradeoff as images: not filename-hashed,
# so an edit needs up to 30 days to reach return visitors, same as logo/photo updates today)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML — always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
